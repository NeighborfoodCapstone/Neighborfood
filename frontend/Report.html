<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>신고하기 - NeighborFood</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script src="shared/auth.js"></script>
<script src="shared/guard.js"></script>
<script>nfRequireMember();</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="shared/tokens.css" rel="stylesheet"/>
<script>
  tailwind.config = { theme: { extend: { colors: {
    primary:'#006e1c','primary-fixed':'#94f990','on-primary-fixed-variant':'#005313',
    secondary:'#8b5000','secondary-container':'#ff9800','secondary-fixed':'#ffdcbe','on-secondary-fixed-variant':'#693c00',
    'on-surface':'#191c1d','on-surface-variant':'#3f4a3c',outline:'#6f7a6b','outline-variant':'#becab9',
    error:'#ba1a1a','error-container':'#ffdad6','on-error-container':'#93000a',
    'surface-container-low':'#f3f4f5','surface-container':'#edeeef',
    warm:'#faf9f5'
  }, fontFamily:{ sans:['"Plus Jakarta Sans"','"Noto Sans KR"','system-ui'] } }}}
</script>
<style>
  body { background:#faf9f5; min-height:max(884px,100dvh); font-family:'Plus Jakarta Sans','Noto Sans KR',system-ui; }
  .ring-soft { box-shadow: 0 0 0 1px rgba(0,0,0,.05); }
  .ph { background: repeating-linear-gradient(135deg, #eef2ea 0 8px, #e4ebe0 8px 16px); }
  .reason input { position:absolute; opacity:0; }
  .reason { display:flex; align-items:center; gap:10px; padding:14px; border-radius:12px; background:#fff; box-shadow: 0 0 0 1px rgba(0,0,0,.05); cursor:pointer; }
  .reason .dot { width:18px; height:18px; border-radius:50%; border:2px solid #becab9; background:#fff; flex-shrink:0; position:relative; }
  .reason input:checked + .dot { border-color:#ba1a1a; }
  .reason input:checked + .dot::after { content:''; position:absolute; inset:2px; border-radius:50%; background:#ba1a1a; }
  .reason input:checked ~ .label { font-weight:700; color:#ba1a1a; }
</style>
</head>
<body class="text-on-surface antialiased pb-32">

<header class="sticky top-0 z-40 bg-warm/90 backdrop-blur border-b border-black/[.04]">
  <div class="max-w-2xl mx-auto px-3 h-14 flex items-center">
    <button onclick="history.back()" class="w-10 h-10 rounded-full hover:bg-black/5 flex items-center justify-center"><span class="material-symbols-outlined">arrow_back</span></button>
    <h1 class="text-[15px] font-bold ml-1">신고하기</h1>
  </div>
</header>

<main class="max-w-2xl mx-auto px-4 pt-4">

  <!-- Subject card -->
  <section id="subjectCard" class="bg-white rounded-2xl ring-soft p-3 flex items-start gap-3">
    <div class="w-16 h-16 rounded-xl ph shrink-0"></div>
    <div class="flex-1 min-w-0">
      <span id="subjectBadge" class="inline-block text-[10px] font-bold bg-error-container text-on-error-container px-2 py-0.5 rounded-full mb-1">신고하기</span>
      <p id="subjectTitle" class="text-[13.5px] font-semibold leading-snug">신고 대상을 불러오는 중…</p>
      <p id="subjectSub" class="text-[11px] text-on-surface-variant mt-0.5"></p>
    </div>
  </section>

  <p class="text-[12.5px] text-on-surface-variant mt-4 leading-relaxed">
    NeighborFood의 건강한 커뮤니티를 위해 신고 사유를 명확히 선택해 주세요. 관리팀에서 24시간 안에 검토합니다.
  </p>

  <!-- Reasons -->
  <section class="mt-4">
    <p class="text-[11px] font-bold text-on-surface-variant tracking-wide mb-2">신고 사유 <span class="text-error">*</span></p>
    <div class="space-y-2">
      <label class="reason"><input type="radio" name="r" value="잘못된 식품 정보 · 위생 위험"/><span class="dot"></span><span class="label text-[13.5px]">잘못된 식품 정보 · 위생 위험</span></label>
      <label class="reason"><input type="radio" name="r" value="스팸 · 광고 · 도배"/><span class="dot"></span><span class="label text-[13.5px]">스팸 · 광고 · 도배</span></label>
      <label class="reason"><input type="radio" name="r" value="사기 · 사칭 의심"/><span class="dot"></span><span class="label text-[13.5px]">사기 · 사칭 의심</span></label>
      <label class="reason"><input type="radio" name="r" value="거래 매너 불량"/><span class="dot"></span><span class="label text-[13.5px]">거래 매너 불량</span></label>
      <label class="reason"><input type="radio" name="r" value="공동구매 노쇼 (정산 미이행)"/><span class="dot"></span><span class="label text-[13.5px]">공동구매 노쇼 (정산 미이행)</span></label>
      <label class="reason"><input type="radio" name="r" value="혐오 표현 · 부적절한 언어"/><span class="dot"></span><span class="label text-[13.5px]">혐오 표현 · 부적절한 언어</span></label>
      <label class="reason"><input type="radio" name="r" value="개인정보 노출"/><span class="dot"></span><span class="label text-[13.5px]">개인정보 노출</span></label>
      <label class="reason"><input type="radio" name="r" value="기타"/><span class="dot"></span><span class="label text-[13.5px]">기타</span></label>
    </div>
  </section>

  <!-- Details -->
  <section class="mt-5">
    <div class="flex items-center justify-between mb-2">
      <p class="text-[11px] font-bold text-on-surface-variant tracking-wide">상세 내용 <span class="text-error">*</span></p>
      <p id="charCount" class="text-[10.5px] text-on-surface-variant">0 / 500</p>
    </div>
    <textarea id="detailText" rows="5" class="w-full bg-white rounded-2xl ring-1 ring-outline-variant px-4 py-3.5 text-[14px] leading-6 resize-none focus:ring-2 focus:ring-error outline-none" placeholder="언제, 어떤 상황이 있었는지 구체적으로 적어주세요. 사실관계 파악에 큰 도움이 됩니다." maxlength="500"></textarea>
  </section>

  <!-- Evidence -->
  <section class="mt-5">
    <p class="text-[11px] font-bold text-on-surface-variant tracking-wide mb-2">증빙 자료 <span class="text-on-surface-variant/60 font-medium">(선택, 최대 3장)</span></p>
    <div class="flex gap-2">
      <button class="w-20 h-20 rounded-xl border-2 border-dashed border-outline-variant bg-white flex flex-col items-center justify-center text-on-surface-variant">
        <span class="material-symbols-outlined" style="font-size:22px">add_a_photo</span>
        <span class="text-[10px] mt-0.5 font-semibold">0/3</span>
      </button>
      <p class="flex-1 text-[11.5px] text-on-surface-variant self-center bg-surface-container-low rounded-xl px-3 py-3 leading-relaxed">스크린샷이나 사진을 첨부하면 처리가 더 빨라요. 개인정보가 보이면 가려서 올려주세요.</p>
    </div>
  </section>

  <!-- Anonymity -->
  <section class="mt-5 bg-white rounded-2xl ring-soft divide-y divide-black/[.05]">
    <label class="flex items-center justify-between px-4 py-3.5">
      <div>
        <p class="text-[13.5px] font-semibold">익명 신고</p>
        <p class="text-[11px] text-on-surface-variant mt-0.5">신고 내용에만 사용되며, 상대방에게 노출되지 않아요</p>
      </div>
      <span class="w-10 h-6 bg-primary rounded-full p-0.5 flex justify-end"><span class="w-5 h-5 bg-white rounded-full shadow"></span></span>
    </label>
    <label class="flex items-center justify-between px-4 py-3.5">
      <div>
        <p class="text-[13.5px] font-semibold">상대방 차단</p>
        <p class="text-[11px] text-on-surface-variant mt-0.5">앞으로 이 사용자의 글을 보지 않아요</p>
      </div>
      <span class="w-10 h-6 bg-outline-variant rounded-full p-0.5"><span class="w-5 h-5 bg-white rounded-full shadow"></span></span>
    </label>
  </section>

  <!-- Warning -->
  <section class="mt-4 bg-[#fff7ec] border border-[#ffe4bd] rounded-2xl p-3.5 flex gap-2">
    <span class="material-symbols-outlined text-secondary shrink-0" style="font-size:18px;font-variation-settings:'FILL' 1;">info</span>
    <p class="text-[11.5px] text-on-surface leading-relaxed">허위 신고는 NeighborFood 이용에 제한이 있을 수 있어요. 사실에 기반해서 신중하게 작성해 주세요.</p>
  </section>

</main>

<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-black/[.06] z-40">
  <div class="max-w-2xl mx-auto px-4 py-3 pb-6 flex gap-2">
    <button onclick="history.back()" class="px-4 rounded-2xl ring-1 ring-outline-variant bg-white text-[13px] font-semibold">취소</button>
    <button id="submitBtn" class="flex-1 bg-error text-white rounded-2xl py-3.5 text-[14px] font-bold active:scale-[.99] transition flex items-center justify-center gap-1.5">
      <span class="material-symbols-outlined" style="font-size:18px">flag</span>
      신고 제출
    </button>
  </div>
</div>

<script>
(function(){
  var API = window.location.origin;
  var qs = new URLSearchParams(location.search);

  // FastAPI 에러 detail을 안전하게 문자열화
  function detailMsg(d) {
    if (!d) return '';
    var det = d.detail;
    if (typeof det === 'string') return det;
    if (Array.isArray(det)) return det.map(function(e){ return e && e.msg ? e.msg : ''; }).filter(Boolean).join(', ');
    if (det && typeof det === 'object') return det.msg || JSON.stringify(det);
    return '';
  }

  // URL 파라미터
  // targetType  : 'user' | 'post'
  // targetId    : 신고 대상 id
  // targetName  : 표시용 이름
  // reason      : 사유 프리필 (노쇼 등)
  // detail      : 상세 내용 프리필
  // settlementId: 정산 화면 복귀용 (노쇼 경유 시)
  // postId      : 정산 복귀용 (noshow 콜백)
  var targetType   = qs.get('targetType') || 'user';
  var targetId     = qs.get('targetId');
  var targetName   = qs.get('targetName') || '신고 대상';
  var preReason    = qs.get('reason')  || '';
  var preDetail    = qs.get('detail')  || '';
  var settlementId = qs.get('settlementId');
  var postId       = qs.get('postId');
  var noshowUserId = qs.get('noshowUserId');   // 정산 노쇼 신고 대상 (있으면 noshow API도 호출)

  // ── 신고 대상 카드 세팅 ──
  var badge = document.getElementById('subjectBadge');
  var title = document.getElementById('subjectTitle');
  var sub   = document.getElementById('subjectSub');

  if (targetType === 'user') {
    badge.textContent = '사용자 신고';
    title.textContent = targetName;
    sub.textContent   = preReason ? '사유: ' + preReason : '';
  } else {
    badge.textContent = '게시글 신고';
    title.textContent = targetName;
    sub.textContent   = '';
    if (targetId) {
      // 게시글 제목 가져오기 시도
      fetch(API + '/api/posts/' + targetId)
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(p){ if(p && p.title) title.textContent = p.title; })
        .catch(function(){});
    }
  }

  // ── 사유 프리필 ──
  if (preReason) {
    var radios = document.querySelectorAll('input[name="r"]');
    var matched = false;
    radios.forEach(function(r){
      if (r.value === preReason) { r.checked = true; matched = true; }
    });
    if (!matched) {
      // 정확히 일치하는 항목 없으면 '기타' 체크
      radios.forEach(function(r){ if (r.value === '기타') r.checked = true; });
    }
  } else {
    // 기본 선택: 첫 번째
    var first = document.querySelector('input[name="r"]');
    if (first) first.checked = true;
  }

  // ── 상세 내용 프리필 + 글자 수 카운터 ──
  var detailEl = document.getElementById('detailText');
  var countEl  = document.getElementById('charCount');
  if (preDetail) detailEl.value = preDetail;
  function updateCount() {
    countEl.textContent = detailEl.value.length + ' / 500';
  }
  detailEl.addEventListener('input', updateCount);
  updateCount();

  // ── 신고 제출 ──
  var submitBtn = document.getElementById('submitBtn');
  submitBtn.addEventListener('click', async function(){
    if (!targetId) { alert('신고 대상 정보가 없습니다. 이전 화면에서 다시 시도해 주세요.'); return; }
    var selectedRadio = document.querySelector('input[name="r"]:checked');
    if (!selectedRadio) { alert('신고 사유를 선택해 주세요.'); return; }
    var detail = detailEl.value.trim();
    if (!detail) { alert('상세 내용을 입력해 주세요.'); return; }

    var reasonText = selectedRadio.value
      + (detail ? ' — ' + detail.slice(0, 200) : '');

    submitBtn.disabled = true;
    try {
      var r = await fetch(API + '/api/reports', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          target_type: targetType,
          target_id:   Number(targetId),
          reason:      reasonText.slice(0, 500)
        })
      });
      if (window.nfHandleAuthError && nfHandleAuthError(r)) return;
      var d = await r.json().catch(function(){return {};});
      if (r.ok) {
        // 노쇼 신고 컨텍스트: 신고 접수와 함께 정산 노쇼 처리(status='noshow' + trust_score 페널티)
        if (settlementId && noshowUserId) {
          try {
            await fetch(API + '/api/settlements/' + settlementId + '/shares/' + noshowUserId + '/noshow', {
              method: 'POST', headers: { 'Content-Type': 'application/json' }
            });
          } catch(_) {}
        }
        // 노쇼 신고 경유 시: 정산 화면으로 복귀
        if (settlementId || postId) {
          var back = postId
            ? 'Settlement.html?postId=' + postId
            : 'Settlement.html?settlementId=' + settlementId;
          alert('신고가 접수되었습니다.');
          location.href = back;
        } else {
          alert('신고가 접수되었습니다. 관리팀이 24시간 안에 검토합니다.');
          history.back();
        }
      } else {
        alert(detailMsg(d) || '신고 제출에 실패했습니다.');
        submitBtn.disabled = false;
      }
    } catch(_){
      alert('서버에 연결할 수 없어요.');
      submitBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
