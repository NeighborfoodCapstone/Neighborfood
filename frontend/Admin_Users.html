<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>사용자 관리 - NeighborFood</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script src="shared/auth.js"></script>
<script src="shared/adminGuard.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="shared/tokens.css" rel="stylesheet"/>
<script>
  tailwind.config = { theme: { extend: { colors: {
    primary:'#006e1c','primary-fixed':'#94f990','primary-fixed-dim':'#78dc77','on-primary-fixed-variant':'#005313',
    secondary:'#8b5000','secondary-container':'#ff9800','secondary-fixed':'#ffdcbe','on-secondary-fixed-variant':'#693c00','secondary-fixed-dim':'#ffb870',
    tertiary:'#466270','tertiary-fixed-dim':'#adcbda','on-tertiary-container':'#183642',
    'on-surface':'#191c1d','on-surface-variant':'#3f4a3c',outline:'#6f7a6b','outline-variant':'#becab9',
    error:'#ba1a1a','error-container':'#ffdad6','on-error-container':'#93000a',
    'surface-container-low':'#f3f4f5','surface-container':'#edeeef','surface-container-high':'#e7e8e9',
    ink:'#2c322b'
  }, fontFamily:{ sans:['"Plus Jakarta Sans"','"Noto Sans KR"','system-ui'] } }}}
</script>
<style>
  body { background:#f3f4f5; min-height:100dvh; font-family:'Plus Jakarta Sans','Noto Sans KR',system-ui; }
  .ring-soft { box-shadow: 0 0 0 1px rgba(0,0,0,.05); }
  .sidebar { background:#2c322b; color:#fff; width:240px; }
  .nav a { display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:10px; color:rgba(255,255,255,.78); font-size:13px; font-weight:500; text-decoration:none; }
  .nav a:hover { background:rgba(255,255,255,.06); color:#fff; }
  .nav a.on { background:#005313; color:#fff; font-weight:700; }
  .group-label { font-size:10px; font-weight:700; letter-spacing:.1em; color:rgba(255,255,255,.5); margin:18px 8px 6px; text-transform:uppercase; }
</style>
</head>
<body class="text-on-surface antialiased">

<div class="flex min-h-screen">

  <!-- Sidebar (shared) -->
  <aside class="sidebar shrink-0 hidden md:flex md:flex-col px-3 py-5 sticky top-0 h-screen overflow-y-auto">
    <div class="px-2 mb-4 flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-primary-fixed"></span>
      <p class="font-extrabold text-[15px] tracking-tight">NeighborFood</p>
      <span class="ml-auto text-[9px] font-bold bg-error text-white px-1.5 py-0.5 rounded">ADMIN</span>
    </div>
    <nav class="nav flex flex-col gap-0.5">
      <p class="group-label">개요</p>
      <a href="Admin_Dashboard.html"><span class="material-symbols-outlined" style="font-size:18px">dashboard</span> 대시보드</a>
      <p class="group-label">운영</p>
      <a href="Admin_Report_Detail.html"><span class="material-symbols-outlined" style="font-size:18px">flag</span> 신고 처리 <span id="navReportBadge" class="ml-auto text-[10px] bg-error text-white px-1.5 rounded">0</span></a>
      <a href="Admin_Chat_History.html"><span class="material-symbols-outlined" style="font-size:18px">chat</span> 채팅 기록</a>
      <a href="Admin_Notices.html"><span class="material-symbols-outlined" style="font-size:18px">campaign</span> 공지 관리</a>
      <p class="group-label">사용자</p>
      <a class="on" href="Admin_Users.html"><span class="material-symbols-outlined" style="font-size:18px">group</span> 사용자 관리</a>
      <a href="Admin_Staff_Invite.html"><span class="material-symbols-outlined" style="font-size:18px">person_add</span> 운영진 초대</a>
      <p class="group-label">기타</p>
      <a href="#"><span class="material-symbols-outlined" style="font-size:18px">settings</span> 설정</a>
    </nav>
    <div class="mt-auto bg-white/5 rounded-xl p-2.5 flex gap-2.5 items-center mt-6">
      <div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed-variant text-[11px] font-bold">박</div>
      <div class="text-[11.5px] min-w-0 flex-1"><p id="adminName" class="font-semibold truncate">관리자</p><p class="text-white/50 text-[10px]">슈퍼 관리자</p></div>
      <span class="material-symbols-outlined text-white/60 cursor-pointer hover:text-white" style="font-size:18px" onclick="nfLogout('Login.html')">logout</span>
    </div>
  </aside>

  <main class="flex-1 min-w-0">
    <header class="bg-white border-b border-black/[.05] sticky top-0 z-10">
      <div class="px-5 h-14 flex items-center gap-3">
        <button class="md:hidden w-9 h-9 rounded-full hover:bg-black/5 flex items-center justify-center"><span class="material-symbols-outlined">menu</span></button>
        <div class="flex-1 max-w-md bg-surface-container-low rounded-xl px-3 py-2 flex items-center gap-2 text-[12.5px] text-on-surface-variant">
          <span class="material-symbols-outlined" style="font-size:16px">search</span>
          <input id="searchInput" class="bg-transparent outline-none flex-1" placeholder="닉네임, ID 검색..."/>
        </div>
        <button class="w-9 h-9 rounded-full hover:bg-black/5 flex items-center justify-center"><span class="material-symbols-outlined">notifications</span></button>
      </div>
    </header>

    <div class="p-5 md:p-6 max-w-[1200px]">

      <div class="flex items-end justify-between flex-wrap gap-3 mb-4">
        <div>
          <p class="text-[11px] font-bold text-on-surface-variant tracking-wide">USER MANAGEMENT</p>
          <h1 class="text-[24px] font-bold mt-0.5">사용자 관리</h1>
          <p class="text-[12px] text-on-surface-variant mt-1">총 <b id="sumAll" class="text-on-surface">-</b>명 · 정상 <b id="sumActive" class="text-primary">-</b>명 · 정지 <b id="sumSuspended" class="text-error">-</b>명</p>
        </div>
        <div class="flex gap-2">
          <button class="text-[12px] bg-white px-3 py-2 rounded-lg ring-1 ring-outline-variant font-semibold flex items-center gap-1.5"><span class="material-symbols-outlined" style="font-size:14px">download</span> 내보내기</button>
          <button class="text-[12px] bg-ink text-white px-3 py-2 rounded-lg font-bold flex items-center gap-1.5"><span class="material-symbols-outlined" style="font-size:14px">person_add</span> 사용자 초대</button>
        </div>
      </div>

      <!-- Filter chips -->
      <div id="filterChips" class="flex flex-wrap gap-2 mb-3">
        <button data-status="" class="chip on text-[11.5px] font-bold bg-ink text-white px-3 py-1.5 rounded-full">전체 <span data-count="all">-</span></button>
        <button data-status="active" class="chip text-[11.5px] font-semibold bg-white text-on-surface px-3 py-1.5 rounded-full ring-1 ring-black/5">정상 <span data-count="active">-</span></button>
        <button data-status="suspended" class="chip text-[11.5px] font-semibold bg-white text-error px-3 py-1.5 rounded-full ring-1 ring-error/30">정지 <span data-count="suspended">-</span></button>
      </div>

      <!-- Table -->
      <section class="bg-white rounded-2xl ring-soft overflow-hidden">
        <div class="px-4 py-2.5 border-b border-black/[.05] flex items-center justify-between text-[12px]">
          <p class="text-on-surface-variant">선택된 <b class="text-on-surface">0</b>명</p>
          <div class="flex gap-1">
            <button class="px-2.5 py-1 rounded-md hover:bg-black/5">정렬</button>
            <button class="px-2.5 py-1 rounded-md hover:bg-black/5">컬럼</button>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-[12.5px] min-w-[820px]">
            <thead class="text-[10.5px] text-on-surface-variant text-left">
              <tr class="border-b border-black/[.05] bg-surface-container-low">
                <th class="py-2.5 pl-4 font-bold w-8"><input type="checkbox" class="rounded"/></th>
                <th class="py-2.5 font-bold tracking-wider">USER</th>
                <th class="py-2.5 font-bold tracking-wider">동네</th>
                <th class="py-2.5 font-bold tracking-wider">신뢰 온도</th>
                <th class="py-2.5 font-bold tracking-wider">거래</th>
                <th class="py-2.5 font-bold tracking-wider">신고</th>
                <th class="py-2.5 font-bold tracking-wider">가입</th>
                <th class="py-2.5 font-bold tracking-wider">상태</th>
                <th class="py-2.5 pr-4 font-bold tracking-wider text-right">조치</th>
              </tr>
            </thead>
            <tbody id="userTbody">
              <tr><td colspan="9" class="py-8 text-center text-on-surface-variant">불러오는 중…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="px-4 py-3 border-t border-black/[.05] flex items-center justify-between text-[12px] text-on-surface-variant">
          <p id="listFooter">-</p>
          <p class="text-[11px] text-on-surface-variant/70">최근 200명까지 표시</p>
        </div>
      </section>

    </div>
  </main>
</div>

<script>
(function(){
  const API = window.location.origin;
  let ME = null;                 // 로그인한 관리자 (본인 계정 조치 방지용)
  let currentStatus = '';        // '' | 'active' | 'suspended'
  let currentQuery  = '';

  function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
  function initial(nick){ const s=(nick||'').trim(); return s ? s[0] : '?'; }
  function fmtDate(iso){ if(!iso) return '-'; const d=new Date(iso.endsWith('Z')||iso.includes('+')?iso:iso+'Z'); return isNaN(d)?'-':d.toLocaleDateString('ko-KR'); }
  function setText(id,v){ const el=document.getElementById(id); if(el) el.textContent=v; }

  const STATUS_BADGE = {
    active:    '<span class="text-[10px] font-bold bg-primary-fixed text-on-primary-fixed-variant px-2 py-0.5 rounded-full">정상</span>',
    suspended: '<span class="text-[10px] font-bold bg-error text-white px-2 py-0.5 rounded-full">정지</span>',
  };

  // ── 한 행 렌더링 ──
  function renderRow(u){
    const isSelf = ME && u.id === ME.id;
    const temp = (u.trust_score==null) ? '-' : Number(u.trust_score).toFixed(1)+'°';
    const tempCls = (u.trust_score!=null && u.trust_score < 36.5) ? 'text-error' : 'text-primary';
    const reportCell = u.report_count > 0
      ? '<span class="text-[10px] font-bold text-error">'+u.report_count+'건</span>'
      : '<span class="text-on-surface-variant">—</span>';

    // 조치 메뉴: 상태에 따라 정지/복구, 그리고 role 승격/강등. 본인 계정은 조치 불가.
    let actions = '';
    if(!isSelf){
      if(u.status==='active')
        actions += '<button data-act="suspend" data-id="'+u.id+'" data-nick="'+esc(u.nickname)+'" class="act-btn block w-full text-left px-3 py-2 text-[12px] text-error hover:bg-error/5">계정 정지</button>';
      else
        actions += '<button data-act="activate" data-id="'+u.id+'" data-nick="'+esc(u.nickname)+'" class="act-btn block w-full text-left px-3 py-2 text-[12px] text-primary hover:bg-primary/5">정지 해제</button>';
      if(u.role!=='admin')
        actions += '<button data-act="promote" data-id="'+u.id+'" data-nick="'+esc(u.nickname)+'" class="act-btn block w-full text-left px-3 py-2 text-[12px] hover:bg-black/5">운영진 승격</button>';
      else
        actions += '<button data-act="demote" data-id="'+u.id+'" data-nick="'+esc(u.nickname)+'" class="act-btn block w-full text-left px-3 py-2 text-[12px] hover:bg-black/5">운영진 해제</button>';
    } else {
      actions = '<p class="px-3 py-2 text-[11px] text-on-surface-variant">본인 계정</p>';
    }

    const roleTag = u.role==='admin'
      ? ' <span class="text-[9px] bg-ink text-white px-1.5 py-0.5 rounded font-bold align-middle">관리자</span>' : '';

    return ''
      + '<tr class="border-b border-black/[.04] hover:bg-surface-container-low/40'+(u.status==='suspended'?' bg-error-container/20':'')+'">'
      + '<td class="py-3 pl-4"><input type="checkbox" class="rounded"/></td>'
      + '<td><div class="flex items-center gap-2">'
      +   '<div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed-variant text-[11px] font-bold">'+esc(initial(u.nickname))+'</div>'
      +   '<div><p class="font-semibold">'+esc(u.nickname||'(이름 없음)')+roleTag+'</p>'
      +   '<p class="text-[10.5px] text-on-surface-variant">@'+esc(u.login_id)+'</p></div>'
      + '</div></td>'
      + '<td>'+esc(u.neighborhood||'(미설정)')+'</td>'
      + '<td><span class="font-bold '+tempCls+'">'+temp+'</span></td>'
      + '<td>'+ (u.tx_count>0 ? u.tx_count+'건' : '<span class="text-on-surface-variant">—</span>') +'</td>'
      + '<td>'+reportCell+'</td>'
      + '<td class="text-on-surface-variant">'+fmtDate(u.created_at)+'</td>'
      + '<td>'+(STATUS_BADGE[u.status]||esc(u.status))+'</td>'
      + '<td class="pr-4 text-right relative">'
      +   '<button class="menu-toggle text-on-surface-variant hover:text-on-surface"><span class="material-symbols-outlined" style="font-size:18px">more_horiz</span></button>'
      +   '<div class="menu hidden absolute right-4 top-9 z-20 bg-white rounded-xl shadow-lg ring-1 ring-black/10 py-1 min-w-[130px]">'+actions+'</div>'
      + '</td>'
      + '</tr>';
  }

  // ── 목록 로드 ──
  async function loadUsers(){
    const tb = document.getElementById('userTbody');
    tb.innerHTML = '<tr><td colspan="9" class="py-8 text-center text-on-surface-variant">불러오는 중…</td></tr>';
    const params = new URLSearchParams();
    if(currentQuery)  params.set('q', currentQuery);
    if(currentStatus) params.set('status', currentStatus);
    let d=null;
    try{
      const r = await fetch(API+'/api/admin/users?'+params.toString());
      if(window.nfHandleAuthError && nfHandleAuthError(r)) return;
      d = r.ok ? await r.json() : null;
    }catch(e){}
    if(!d){ tb.innerHTML='<tr><td colspan="9" class="py-8 text-center text-error">불러오지 못했어요.</td></tr>'; return; }

    // 상단 요약 + 필터칩 카운트
    setText('sumAll', (d.counts.all||0).toLocaleString());
    setText('sumActive', (d.counts.active||0).toLocaleString());
    setText('sumSuspended', (d.counts.suspended||0).toLocaleString());
    document.querySelectorAll('#filterChips [data-count]').forEach(function(el){
      const k = el.getAttribute('data-count');
      el.textContent = (d.counts[k]!=null ? d.counts[k] : 0).toLocaleString();
    });

    if(!d.items.length){
      tb.innerHTML = '<tr><td colspan="9" class="py-8 text-center text-on-surface-variant">조건에 맞는 회원이 없습니다.</td></tr>';
      setText('listFooter','0명');
    } else {
      tb.innerHTML = d.items.map(renderRow).join('');
      setText('listFooter', d.count.toLocaleString()+'명 표시');
      bindRowMenus();
    }
  }

  // ── 행 메뉴 토글 + 액션 바인딩 ──
  function bindRowMenus(){
    document.querySelectorAll('.menu-toggle').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        const menu = btn.parentElement.querySelector('.menu');
        // 다른 메뉴 닫기
        document.querySelectorAll('.menu').forEach(function(m){ if(m!==menu) m.classList.add('hidden'); });
        menu.classList.toggle('hidden');
      });
    });
    document.querySelectorAll('.act-btn').forEach(function(b){
      b.addEventListener('click', function(){ handleAction(b.dataset.act, Number(b.dataset.id), b.dataset.nick); });
    });
  }
  // 바깥 클릭 시 메뉴 닫기
  document.addEventListener('click', function(){
    document.querySelectorAll('.menu').forEach(function(m){ m.classList.add('hidden'); });
  });

  // ── 액션 처리 ──
  const ACT = {
    suspend:  { patch:{status:'suspended'}, confirm:function(n){return '"'+n+'" 계정을 정지할까요? 로그인·활동이 제한됩니다.';}, done:'계정을 정지했습니다.' },
    activate: { patch:{status:'active'},    confirm:function(n){return '"'+n+'" 계정의 정지를 해제할까요?';},                 done:'정지를 해제했습니다.' },
    promote:  { patch:{role:'admin'},       confirm:function(n){return '"'+n+'" 님을 운영진(관리자)으로 승격할까요?';},        done:'운영진으로 승격했습니다.' },
    demote:   { patch:{role:'user'},        confirm:function(n){return '"'+n+'" 님의 운영진 권한을 해제할까요?';},            done:'운영진 권한을 해제했습니다.' },
  };
  async function handleAction(act, id, nick){
    const cfg = ACT[act]; if(!cfg) return;
    if(!confirm(cfg.confirm(nick))) return;
    try{
      const r = await fetch(API+'/api/admin/users/'+id, {
        method:'PATCH', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(cfg.patch)
      });
      if(window.nfHandleAuthError && nfHandleAuthError(r)) return;
      if(r.ok){ loadUsers(); }
      else { const e=await r.json().catch(()=>({})); alert((e&&e.detail)||'처리에 실패했어요.'); }
    }catch(e){ alert('서버에 연결할 수 없어요.'); }
  }

  // ── 필터칩 클릭 ──
  document.querySelectorAll('#filterChips .chip').forEach(function(chip){
    chip.addEventListener('click', function(){
      currentStatus = chip.getAttribute('data-status') || '';
      // active 스타일 토글
      document.querySelectorAll('#filterChips .chip').forEach(function(c){
        c.classList.remove('bg-ink','text-white','font-bold','on');
        c.classList.add('bg-white','font-semibold');
      });
      chip.classList.add('bg-ink','text-white','font-bold','on');
      chip.classList.remove('bg-white','font-semibold');
      loadUsers();
    });
  });

  // ── 검색 (디바운스) ──
  const searchEl = document.getElementById('searchInput');
  let debounce;
  if(searchEl) searchEl.addEventListener('input', function(){
    clearTimeout(debounce);
    debounce = setTimeout(function(){ currentQuery = searchEl.value.trim(); loadUsers(); }, 300);
  });

  // ── 가드 통과 후 시작 ──
  (async function(){
    ME = await nfRequireAdmin('Admin_Users.html');
    if(!ME) return;
    loadUsers();
  })();
})();
</script>
</body>
</html>
