<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>그룹 채팅 - NeighborFood</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="shared/auth.js"></script>
<script src="shared/guard.js"></script>
<script>nfRequireMember();</script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="shared/tokens.css" rel="stylesheet"/>
<script>
  tailwind.config = { theme: { extend: { colors: {
    primary:'#006e1c','on-primary':'#ffffff','primary-fixed':'#94f990','primary-fixed-dim':'#78dc77',
    'on-primary-fixed':'#002204','on-primary-fixed-variant':'#005313',
    secondary:'#8b5000','on-surface':'#191c1d','on-surface-variant':'#3f4a3c',
    background:'#f8f9fa','surface-container':'#edeeef','surface-container-low':'#f3f4f5',
    'surface-container-high':'#e7e8e9','outline-variant':'#becab9','on-background':'#191c1d'
  }, fontFamily:{ sans:['"Plus Jakarta Sans"','"Noto Sans KR"','system-ui'] } }}}
</script>
<style>
  html,body{ font-family:'Plus Jakarta Sans','Noto Sans KR',system-ui; -webkit-font-smoothing:antialiased; }
  body{ min-height:max(884px,100dvh); }
  @keyframes msg-in { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
  .msg{ animation:msg-in 240ms ease-out both; }
  .chat-bg{ background-color:#f6f7f4;
    background-image:radial-gradient(circle at 18% 12%, rgba(120,220,119,.08), transparent 40%),
                     radial-gradient(circle at 82% 88%, rgba(255,184,112,.07), transparent 45%); }
  main::-webkit-scrollbar{ width:0; }
</style>
</head>
<body class="bg-background text-on-background h-screen flex flex-col antialiased">

<!-- Header -->
<header class="bg-white/85 backdrop-blur-md fixed top-0 w-full z-50 border-b border-zinc-100 flex items-center px-2 h-14">
  <button onclick="history.back()" class="w-10 h-10 rounded-full hover:bg-black/5 flex items-center justify-center" aria-label="뒤로">
    <span class="material-symbols-outlined">arrow_back</span>
  </button>
  <div class="flex items-center gap-2.5 min-w-0 pl-1">
    <div class="w-9 h-9 rounded-full bg-gradient-to-br from-primary-fixed to-primary-fixed-dim flex items-center justify-center shrink-0">
      <span class="material-symbols-outlined text-on-primary-fixed" style="font-size:20px">groups</span>
    </div>
    <div class="flex flex-col items-start min-w-0">
      <span id="groupTitle" class="font-semibold text-[15px] text-on-surface truncate">공동구매 채팅</span>
      <span id="memberCount" class="text-[11px] text-on-surface-variant leading-none mt-0.5">참여자 불러오는 중…</span>
    </div>
  </div>
</header>

<!-- Deal action bar (약속 확정 / GPS·정산 이동) -->
<div id="dealBar" class="fixed top-14 w-full z-40 bg-white/95 backdrop-blur border-b border-black/[.05] hidden">
  <div class="max-w-2xl mx-auto px-3 py-2 flex items-center gap-2">
    <div id="dealInfo" class="flex-1 min-w-0 text-[11.5px] text-on-surface-variant leading-tight truncate">거래 장소·시간이 아직 정해지지 않았어요.</div>
    <button id="dealHostBtn" class="hidden shrink-0 bg-primary text-white rounded-xl px-3 py-1.5 text-[12px] font-bold">장소·시간 정하기</button>
    <button id="dealGpsBtn" class="hidden shrink-0 bg-primary text-white rounded-xl px-3 py-1.5 text-[12px] font-bold flex items-center gap-1"><span class="material-symbols-outlined" style="font-size:15px">my_location</span>거래 인증·정산</button>
  </div>
</div>

<!-- 약속 확정 모달 (주최자) -->
<div id="apptModal" class="fixed inset-0 z-[70] hidden">
  <div class="absolute inset-0 bg-black/40" onclick="nfCloseAppt()"></div>
  <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[90%] max-w-md bg-white rounded-3xl p-5 shadow-xl">
    <p class="text-[15px] font-bold">거래 장소·시간 정하기</p>
    <p class="text-[12px] text-on-surface-variant mt-1 mb-4">확정하면 참여자들이 GPS 인증을 진행할 수 있어요.</p>
    <label class="text-[12px] font-semibold text-on-surface-variant">거래 장소</label>
    <input id="apptPlace" type="text" placeholder="예) 구의역 3번 출구" class="mt-1.5 w-full rounded-xl ring-1 ring-outline-variant px-3 py-2.5 outline-none text-[13px]"/>
    <!-- 현재 위치 캡처 버튼 -->
    <button id="apptLocBtn" onclick="nfGetCurrentLoc()"
      class="mt-2 w-full ring-1 ring-outline-variant rounded-xl py-2.5 text-[12.5px] font-semibold
             flex items-center justify-center gap-1.5 text-on-surface-variant active:bg-surface-container">
      <span class="material-symbols-outlined" style="font-size:16px">my_location</span>현재 위치를 GPS 인증 기준 좌표로 사용
    </button>
    <p id="apptLocInfo" class="text-[11px] text-on-surface-variant mt-1.5 text-center hidden"></p>
    <label class="text-[12px] font-semibold text-on-surface-variant mt-4 block">거래 일시</label>
    <input id="apptAt" type="datetime-local" class="mt-1.5 w-full rounded-xl ring-1 ring-outline-variant px-3 py-2.5 outline-none text-[13px]"/>
    <div class="flex gap-2 mt-5">
      <button onclick="nfCloseAppt()" class="flex-1 rounded-2xl py-3 text-[13px] font-bold bg-surface-container text-on-surface">취소</button>
      <button id="apptSaveBtn" class="flex-1 rounded-2xl py-3 text-[13px] font-bold bg-primary text-white">확정하기</button>
    </div>
  </div>
</div>

<!-- Messages -->
<main class="flex-1 overflow-y-auto pt-[92px] pb-[84px] chat-bg">
  <div id="messageList" class="px-4 py-4 max-w-2xl mx-auto flex flex-col gap-2"></div>
</main>

<!-- Input -->
<div class="fixed bottom-0 w-full bg-white/95 backdrop-blur-md border-t border-outline-variant/30 px-3 py-2 pb-5 z-40">
  <div class="max-w-2xl mx-auto flex items-end gap-2">
    <div class="flex-1 bg-surface-container-low rounded-3xl flex items-end px-3 py-1.5 ring-1 ring-transparent focus-within:ring-primary/40 transition-all">
      <textarea id="msgInput" rows="1" class="flex-1 bg-transparent border-none focus:ring-0 text-[14.5px] text-on-surface placeholder:text-on-surface-variant/70 p-1.5 resize-none max-h-24" placeholder="메시지를 입력하세요"></textarea>
    </div>
    <button id="sendBtn" class="p-2 bg-primary text-on-primary rounded-full shrink-0 flex items-center justify-center w-10 h-10 shadow-sm hover:scale-105 active:scale-95 transition-all" aria-label="전송">
      <span class="material-symbols-outlined" style="font-size:20px">send</span>
    </button>
  </div>
</div>

<script>
  (function () {
    const API_BASE = window.location.origin;
    const convId = new URLSearchParams(location.search).get('id');
    const listEl = document.getElementById('messageList');
    const inputEl = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    let lastId = 0, myId = null, prevSender = null, pollTimer = null;
    let nfPostId = null, nfHostId = null, nfSettlementId = null;

    if (!convId) {
      listEl.innerHTML = '<p class="text-center text-[13px] text-on-surface-variant py-10">잘못된 접근이에요. 채팅 목록에서 다시 들어와 주세요.</p>';
      return;
    }

    function esc(t){ const e=document.createElement('div'); e.textContent=t==null?'':t; return e.innerHTML; }
    function hhmm(iso){
      if (!iso) return '';
      const d = new Date(iso.endsWith('Z')||iso.includes('+') ? iso : iso + 'Z');
      let h=d.getHours(), m=String(d.getMinutes()).padStart(2,'0');
      const ap = h<12 ? '오전' : '오후'; h = h%12 || 12;
      return ap+' '+h+':'+m;
    }
    function scrollBottom(){ const m=document.querySelector('main'); if(m) m.scrollTop=m.scrollHeight; }

    function bubble(m){
      const mine = (m.sender_id === myId);
      const time = '<span class="text-[10px] text-on-surface-variant/70 leading-none mb-1">'+hhmm(m.created_at)+'</span>';
      if (mine){
        prevSender = m.sender_id;
        const body = '<div class="max-w-[72%] px-3.5 py-2 text-[14px] leading-relaxed bg-primary text-on-primary rounded-2xl rounded-br-md">'+esc(m.content)+'</div>';
        return '<div class="msg flex items-end gap-1.5 flex-row-reverse">'+body+time+'</div>';
      }
      // 다른 사람: 발신자가 바뀔 때만 아바타+이름 표시(연속 메시지는 생략)
      const showName = (prevSender !== m.sender_id);
      prevSender = m.sender_id;
      const name = esc(m.sender_nickname || '이웃');
      const ini = (m.sender_nickname || '?').trim().charAt(0) || '?';
      const avatar = showName
        ? '<div class="w-7 h-7 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed-variant text-[12px] font-bold shrink-0">'+esc(ini)+'</div>'
        : '<div class="w-7 shrink-0"></div>';
      const nameLine = showName ? '<p class="text-[11px] text-on-surface-variant mb-0.5 ml-0.5">'+name+'</p>' : '';
      const body = '<div class="max-w-[72%] px-3.5 py-2 text-[14px] leading-relaxed bg-white text-on-surface rounded-2xl rounded-bl-md ring-1 ring-black/[.04]">'+esc(m.content)+'</div>';
      return '<div class="msg flex flex-col items-start">'+nameLine
        + '<div class="flex items-end gap-1.5">'+avatar+body+time+'</div></div>';
    }

    async function loadMe(){
      try{ const r=await fetch(API_BASE+'/api/users/me');
        if(window.nfHandleAuthError && nfHandleAuthError(r)) return;
        if(r.ok){ myId=(await r.json()).id; } }catch(e){}
    }
    async function loadHeader(){
      try{
        const r=await fetch(API_BASE+'/api/chats/group/'+convId+'/members');
        if(window.nfHandleAuthError && nfHandleAuthError(r)) return;
        if(!r.ok) return;
        const d=await r.json();
        document.getElementById('groupTitle').textContent = '공동구매 · ' + (d.title || '');
        document.getElementById('memberCount').textContent = '참여자 ' + d.count + '명';
        nfPostId = d.postId; nfHostId = d.hostId;
        await nfRefreshDealBar();
      }catch(e){}
    }

    // ── 거래 확정/GPS·정산 액션 바 ──
    async function nfRefreshDealBar(){
      if (nfPostId == null || myId == null) return;
      const bar = document.getElementById('dealBar');
      const info = document.getElementById('dealInfo');
      const hostBtn = document.getElementById('dealHostBtn');
      const gpsBtn = document.getElementById('dealGpsBtn');
      const isHost = (myId === nfHostId);

      // 정산 조회 (없으면 404)
      let stl = null;
      try {
        const r = await fetch(API_BASE + '/api/settlements/post/' + nfPostId);
        if (window.nfHandleAuthError && nfHandleAuthError(r)) return;
        if (r.ok) stl = (await r.json()).settlement;
      } catch(e){}

      bar.classList.remove('hidden');
      hostBtn.classList.add('hidden'); gpsBtn.classList.add('hidden');

      if (!stl){
        // 정산 전 — 게시글에 저장된 약속 정보를 표시
        let postAppt = null;
        try {
          const pr = await fetch(API_BASE + '/posts/' + nfPostId);
          if (pr.ok) postAppt = await pr.json();
        } catch(e){}

        let apptLabel = '';
        if (postAppt){
          if (postAppt.appointment_place) apptLabel += postAppt.appointment_place;
          if (postAppt.appointment_at){
            const dt = new Date(postAppt.appointment_at.endsWith('Z')||postAppt.appointment_at.includes('+') ? postAppt.appointment_at : postAppt.appointment_at+'Z');
            if (!isNaN(dt)) apptLabel += (apptLabel?' · ':'') + (dt.getMonth()+1)+'/'+dt.getDate()+' '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');
          }
        }

        if (isHost){
          info.textContent = apptLabel ? ('거래 약속: ' + apptLabel + ' · 정산은 나중에 시작할 수 있어요') : '거래가 모이면 정산을 시작하세요. 먼저 장소·시간을 정할 수 있어요.';
          hostBtn.textContent = apptLabel ? '약속 변경' : '장소·시간 정하기';
          hostBtn.classList.remove('hidden');
          hostBtn.onclick = nfOpenAppt;
          // 약속이 확정됐으면 정산 시작 진입점 제공
          if (apptLabel) {
            gpsBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size:15px">savings</span>정산 시작하기';
            gpsBtn.classList.remove('hidden');
            gpsBtn.onclick = function(){ location.href = 'Settlement.html?postId=' + nfPostId; };
          }
        } else {
          info.textContent = apptLabel ? ('거래 약속: ' + apptLabel) : '주최자가 거래 장소·시간을 정하는 중이에요.';
        }
        return;
      }

      nfSettlementId = stl.id;
      const hasAppt = !!(stl.appointmentAt || stl.appointmentPlace);
      let apptLabel = '';
      if (stl.appointmentPlace) apptLabel += stl.appointmentPlace;
      if (stl.appointmentAt){
        const dt = new Date(stl.appointmentAt.endsWith('Z')||stl.appointmentAt.includes('+') ? stl.appointmentAt : stl.appointmentAt+'Z');
        if (!isNaN(dt)) apptLabel += (apptLabel?' · ':'') + (dt.getMonth()+1)+'/'+dt.getDate()+' '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');
      }

      if (isHost){
        info.textContent = hasAppt ? ('거래 약속: ' + apptLabel) : '거래 장소·시간을 정해 주세요.';
        hostBtn.textContent = hasAppt ? '약속 변경' : '장소·시간 정하기';
        hostBtn.classList.remove('hidden');
        hostBtn.onclick = nfOpenAppt;
        // 주최자도 정산 현황 보기로 이동 가능
        gpsBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size:15px">savings</span>정산 현황';
        gpsBtn.classList.remove('hidden');
        gpsBtn.onclick = function(){ location.href = 'Settlement.html?settlementId=' + nfSettlementId; };
      } else {
        if (!hasAppt){
          info.textContent = '주최자가 거래 장소·시간을 정하는 중이에요.';
        } else {
          info.textContent = '거래 약속: ' + apptLabel;
          gpsBtn.classList.remove('hidden');
          gpsBtn.onclick = function(){ location.href = 'Settlement.html?settlementId=' + nfSettlementId; };
        }
      }
    }

    // ── 약속 모달: 좌표 캡처 + 저장 ─────────────────────────────────────────
    var _apptLat = null, _apptLng = null;

    window.nfGetCurrentLoc = function(){
      var btn = document.getElementById('apptLocBtn');
      var info = document.getElementById('apptLocInfo');

      // PWA / 모바일 보안 컨텍스트 체크 (Geolocation은 HTTPS 또는 localhost에서만 허용)
      if (!window.isSecureContext) {
        info.textContent = '⚠ GPS 기능은 HTTPS 또는 localhost 환경에서만 사용할 수 있어요. '
          + '장소 텍스트만 입력하셔도 약속 확정이 가능합니다.';
        info.classList.remove('hidden');
        info.style.color = 'var(--md-sys-color-error, #ba1a1a)';
        return;
      }
      if (!navigator.geolocation) {
        info.textContent = '이 브라우저는 위치 정보를 지원하지 않습니다. 장소 텍스트만 입력해 주세요.';
        info.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:15px">hourglass_top</span>위치 확인 중...';
      navigator.geolocation.getCurrentPosition(
        function(p){
          _apptLat = p.coords.latitude; _apptLng = p.coords.longitude;
          info.textContent = '✓ GPS 좌표 설정 완료 (정확도 ±' + Math.round(p.coords.accuracy) + 'm) — 참여자 100m 검증 기준';
          info.classList.remove('hidden'); info.style.color = 'var(--md-sys-color-primary,#006e1c)';
          btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:15px;font-variation-settings:\'FILL\' 1">check_circle</span>좌표 설정 완료 · 다시 설정';
          btn.disabled = false;
        },
        function(e){
          var msg;
          if (e.code === 1) msg = '위치 권한이 거부됐어요. 브라우저 설정에서 위치 접근을 허용하세요.';
          else if (e.code === 2) msg = '위치를 확인할 수 없어요. GPS 신호가 좋은 곳에서 다시 시도해 주세요.';
          else if (e.code === 3) msg = 'GPS 응답 시간 초과. 잠시 후 다시 시도해 주세요.';
          else msg = '위치 오류: ' + (e.message||'권한 허용 필요') + ' — 장소 텍스트만 입력해도 됩니다.';
          info.textContent = msg;
          info.classList.remove('hidden');
          btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px">my_location</span>현재 위치를 GPS 인증 기준 좌표로 사용';
          btn.disabled = false;
        },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
      );
    };

    window.nfOpenAppt = async function(){
      _apptLat = null; _apptLng = null;
      var info = document.getElementById('apptLocInfo');
      if (info){ info.classList.add('hidden'); info.textContent = ''; }
      var btn = document.getElementById('apptLocBtn');
      if (btn) btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px">my_location</span>현재 위치를 GPS 인증 기준 좌표로 사용';
      document.getElementById('apptModal').classList.remove('hidden');

      // 게시글 기본 위치/좌표 + 기존 약속을 프리필
      if (nfPostId != null){
        try {
          const r = await fetch(API_BASE + '/posts/' + nfPostId);
          if (r.ok){
            const p = await r.json();
            const placeInput = document.getElementById('apptPlace');
            const atInput = document.getElementById('apptAt');
            // 우선순위: 기존 약속 > 게시글 기본 주소
            placeInput.value = p.appointment_place || p.address || '';
            // 좌표: 기존 약속 좌표 > 게시글 좌표
            var plat = (p.appointment_lat != null) ? p.appointment_lat : p.lat;
            var plng = (p.appointment_lng != null) ? p.appointment_lng : p.lng;
            if (plat != null && plng != null){
              _apptLat = plat; _apptLng = plng;
              info.textContent = '✓ 기본 위치 좌표 사용 중 (게시글 위치) — 변경하려면 아래 버튼을 누르세요';
              info.classList.remove('hidden');
              info.style.color = 'var(--md-sys-color-on-surface-variant,#6f7a6b)';
            }
            if (p.appointment_at){
              // ISO → datetime-local 포맷 변환
              try {
                const d = new Date(p.appointment_at.endsWith('Z')||p.appointment_at.includes('+') ? p.appointment_at : p.appointment_at+'Z');
                if (!isNaN(d)){
                  const pad = n=>String(n).padStart(2,'0');
                  atInput.value = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
                }
              } catch(_){}
            }
          }
        } catch(_){}
      }
    };
    window.nfCloseAppt = function(){
      _apptLat = null; _apptLng = null;
      document.getElementById('apptModal').classList.add('hidden');
    };

    async function nfSaveAppt(){
      if (nfPostId == null){ alert('게시글 정보를 불러오는 중이에요. 잠시 후 다시 시도해 주세요.'); return; }
      const place = document.getElementById('apptPlace').value.trim();
      const atLocal = document.getElementById('apptAt').value;
      if (!place && !atLocal){ alert('장소 또는 시간을 입력해 주세요.'); return; }
      const atIso = atLocal ? new Date(atLocal).toISOString() : null;
      const btn = document.getElementById('apptSaveBtn'); btn.disabled = true;
      try {
        // 정산 존재 여부와 무관하게 게시글에 약속 저장 (정산이 있으면 서버가 자동 동기화)
        const r = await fetch(API_BASE + '/posts/' + nfPostId + '/appointment', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            place:          place || null,
            appointment_at: atIso,
            lat:            _apptLat,
            lng:            _apptLng,
          })
        });
        if (window.nfHandleAuthError && nfHandleAuthError(r)) return;
        const d = await r.json().catch(()=>({}));
        if (!r.ok){ alert(d.detail || '확정에 실패했어요.'); return; }
        nfCloseAppt();
        await nfRefreshDealBar();
      } catch(e){ alert('서버에 연결할 수 없어요.'); }
      finally { btn.disabled = false; }
    }
    async function poll(){
      try{
        const r=await fetch(API_BASE+'/api/chats/group/'+convId+'/messages'+(lastId?'?after_id='+lastId:''));
        if(window.nfHandleAuthError && nfHandleAuthError(r)) return;
        if(!r.ok){
          if(r.status===403||r.status===404){
            listEl.innerHTML='<p class="text-center text-[13px] text-on-surface-variant py-10">대화를 불러올 수 없어요.</p>';
            clearInterval(pollTimer);
          }
          return;
        }
        const d=await r.json();
        if(d.items && d.items.length){
          listEl.insertAdjacentHTML('beforeend', d.items.map(bubble).join(''));
          lastId=d.items[d.items.length-1].id;
          scrollBottom();
        }
      }catch(e){}
    }
    async function send(){
      const text=inputEl.value.trim(); if(!text) return;
      inputEl.value=''; inputEl.style.height='auto'; sendBtn.disabled=true;
      try{
        const r=await fetch(API_BASE+'/api/chats/group/'+convId+'/messages',{
          method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({content:text})});
        if(window.nfHandleAuthError && nfHandleAuthError(r)) return;
        if(!r.ok){ const e=await r.json().catch(()=>({})); alert(e.detail||'전송에 실패했어요.'); return; }
        await poll();
      }catch(e){ alert('서버에 연결할 수 없어요.'); }
      finally{ sendBtn.disabled=false; inputEl.focus(); }
    }

    inputEl.addEventListener('input', ()=>{ inputEl.style.height='auto'; inputEl.style.height=Math.min(inputEl.scrollHeight,96)+'px'; });
    inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }});
    sendBtn.addEventListener('click', send);

    document.getElementById('apptSaveBtn').addEventListener('click', nfSaveAppt);

    let nfDealTick = 0;
    (async function init(){
      await loadMe(); await loadHeader(); await poll();
      pollTimer=setInterval(async function(){
        await poll();
        // 12초마다 거래/정산 상태 갱신 (약속 확정·정산 생성 반영)
        if ((++nfDealTick % 3) === 0) await nfRefreshDealBar();
      }, 4000);
    })();
  })();
</script>
</body>
</html>
